name: Deploy Anima Eventos site

on:
  push:
    branches:
      - claude/anima-eventos-website-daigqj
    paths:
      - "anima-eventos/**"
      - ".github/workflows/deploy-anima-eventos.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: anima-eventos
      - id: deployment
        uses: actions/deploy-pages@v4
